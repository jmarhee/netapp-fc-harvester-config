# kubectl apply -f 05-storageclass.yaml
# Output: StorageClass netapp-fcp and VolumeSnapshotClass netapp-fcp-snapclass.
# Both must exist, then run 06-storageprofile.sh. 07 registers netapp-fcp-snapclass.
# https://docs.netapp.com/us-en/trident-2506/trident-use/ontap-san-examples.html
# https://documentation.suse.com/cloudnative/virtualization/v1.5/en/storage/csidriver.html
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: netapp-fcp
provisioner: csi.trident.netapp.io
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate
parameters:
  backendType: ontap-san
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: netapp-fcp-snapclass
driver: csi.trident.netapp.io
deletionPolicy: Delete
