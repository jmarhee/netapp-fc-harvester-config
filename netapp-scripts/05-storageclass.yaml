# kubectl apply -f 05-storageclass.yaml
# StorageClass netapp-fc is pinned to Fibre Channel with sanType: fcp.
# VolumeSnapshotClass trident-snapshotclass is what csi-driver-config records.
# Do not patch the StorageProfile. CDI fills status for csi.trident.netapp.io.
# Confirm: kubectl get storageprofile netapp-fc -o yaml
# https://harvesterhci.io/kb/install_netapp_trident_csi/
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: netapp-fc
provisioner: csi.trident.netapp.io
parameters:
  backendType: "ontap-san"
  sanType: "fcp"
  fsType: "ext4"
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: trident-snapshotclass
driver: csi.trident.netapp.io
deletionPolicy: Delete
