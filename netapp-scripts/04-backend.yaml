# Create the Secret first. Do not commit the password.
# kubectl -n trident create secret generic netapp-creds \
#   --from-literal=username=<ontap user> \
#   --from-literal=password='<ontap password>'
#
# managementLIF is the SVM management LIF. The account is SVM-scoped vsadmin
# with http and ontapi enabled. Trident infers the SVM from that LIF.
# Leave out svm, dataLIF, useREST, spaceReserve, snapshotReserve, and
# limitAggregateUsage. Pin the protocol on the StorageClass with sanType.
# https://blog.5glinux.com/posts/netapp-trident-harvester-yamls/
# kubectl apply -f 04-backend.yaml
# kubectl -n trident get tridentbackendconfig netapp-fc
# PHASE Bound and STATUS Success, then apply 05-storageclass.yaml.
# https://harvesterhci.io/kb/install_netapp_trident_csi/
apiVersion: trident.netapp.io/v1
kind: TridentBackendConfig
metadata:
  name: netapp-fc
  namespace: trident
spec:
  version: 1
  storageDriverName: ontap-san
  sanType: fcp
  backendName: netapp-fc
  managementLIF: MANAGEMENT_LIF
  credentials:
    name: netapp-creds
